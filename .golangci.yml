version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - staticcheck
    - gocyclo
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
  exclusions:
    rules:
      # Generated code: skip linters for files ending in .gen.go (includes
      # client.gen.go); keep hand-written glue (ccloud/ccloud.go) covered.
      - path: \.gen\.go$
        linters:
          - errcheck
          - staticcheck
          - gocyclo
